name: Publish an existing build as a release

# Takes the APK a previous run already produced and publishes it as a release
# asset, without building anything again. Workflow artifacts download as a zip
# and need a GitHub login, which does not work well on a phone; a release asset
# is a plain .apk that can be tapped and installed.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run id that produced the APK'
        required: true
      tag:
        description: 'Release tag to publish under'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the APK from that run
        uses: actions/download-artifact@v4
        with:
          name: Release APK
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk
          APK=$(find apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found in that run's artifact" >&2
            exit 1
          fi
          gh release create "${{ inputs.tag }}" "$APK" \
            --repo "${{ github.repository }}" \
            --title "VortexGram ${{ inputs.tag }}" \
            --notes "Republished from workflow run ${{ inputs.run_id }}, not rebuilt. Installs over your existing VortexGram: same application id and signing key, so your data is kept."
