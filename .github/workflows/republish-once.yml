name: Republish build 41362132782

# One-shot: takes the APK that workflow run 41362132782 already produced and
# publishes it as a release asset, so it can be downloaded as a plain .apk
# instead of a login-gated zip. Nothing is rebuilt. Delete this file once the
# release exists.

on:
  push:
    branches:
      - 'claude/hebrew-conversation-l65mld'

jobs:
  republish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the APK from the earlier run
        uses: actions/download-artifact@v4
        with:
          name: Release APK
          run-id: 41362132782
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find apk -type f -exec ls -la {} \;
          APK=$(find apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK in that run's artifact" >&2
            exit 1
          fi
          gh release view vortexgram-build-1 --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release delete vortexgram-build-1 --repo "${{ github.repository }}" --yes
          gh release create vortexgram-build-1 "$APK" \
            --repo "${{ github.repository }}" \
            --title "VortexGram build 1" \
            --notes "Republished from workflow run 41362132782, not rebuilt. Installs over your existing VortexGram: same application id and signing key, so your data is kept."
          echo "Published:"
          gh release view vortexgram-build-1 --repo "${{ github.repository }}" --json assets --jq '.assets[].url'
