name: Build release APK
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DamianReeves/write-file-action@master
        with:
          path: ./API_KEYS
          contents: |
            APP_ID = 6
            APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
            MAPS_V2_API = ${{ secrets.MAPS_KEY }}

            SIGNING_KEY_PASSWORD = vortexgram_ci
            SIGNING_KEY_ALIAS = vortexgram
            SIGNING_KEY_STORE_PASSWORD = vortexgram_ci
          write-mode: overwrite

      - name: Generate CI signing keystore
        run: |
          rm -f TMessagesProj/config/extera.jks
          keytool -genkey -v \
            -keystore TMessagesProj/config/extera.jks \
            -alias vortexgram \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vortexgram_ci -keypass vortexgram_ci \
            -dname "CN=VortexGram, OU=CI, O=VortexGram, L=Unknown, S=Unknown, C=US" \
            -noprompt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache
          restore-keys: ccache

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install CMake 3.22.1
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt: installing cmake;3.22.1"
            echo "y" | "$SDKM" "cmake;3.22.1" && { echo "CMake installed OK"; break; }
            echo "Download failed, waiting $((attempt * 10))s before retry..."
            sleep $((attempt * 10))
          done
          ls "$ANDROID_HOME/cmake/3.22.1/bin/cmake" || {
            echo "sdkmanager install failed — falling back to NDK-bundled cmake"
            NDK_CMAKE="$ANDROID_HOME/ndk/21.4.7075529/prebuilt/linux-x86_64"
            mkdir -p "$ANDROID_HOME/cmake/3.22.1/bin"
            ln -sf "$NDK_CMAKE/bin/cmake" "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
            ln -sf "$NDK_CMAKE/bin/ninja" "$ANDROID_HOME/cmake/3.22.1/bin/ninja" || true
          }

      - name: Prepare Environment
        run: |
          echo "Removing large packages"
          sudo apt-get update
          sudo apt-get remove -y '^llvm-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y '^mongodb-.*' || true
          sudo apt-get remove -y '^mysql-.*' || true
          sudo apt-get remove -y azure-cli firefox mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          echo "Removing large directories"
          sudo rm -rf /usr/share/dotnet/
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/.ghcup/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          df -h
          
          sudo apt-get install bison gcc make curl ninja-build ccache -y

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Release APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
